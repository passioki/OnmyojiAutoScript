[pytest]
# OAS 测试配置
#
# 仓库原本没有任何 pytest 配置，pytest 也未列入 requirements，
# 导致 tests/ 下的测试既无法被 unittest 收集（多数用例是函数式 + fixture），
# 又缺少稳定的 rootdir 与 import 路径。此文件用于固化测试基线。
#
# 用法：
#   toolkit\python.exe -m pytest                    # 跑全部（当前有 1 个已知收集错误）
#   toolkit\python.exe -m pytest -p no:warnings     # 关闭 pydantic 弃用告警噪音
#
# 已知问题：tests/tasks/Component/GeneralBattle/test_battle_wait.py 无法收集。
# 原因：该测试导入 _DEFAULT_PER_BATTLE，而上游重构 battle_wait.py 时已把该字典
# 改为 _PER_BATTLE_CLASSES 并删除旧符号，测试未同步。修复前请用
# --continue-on-collection-errors 跑其余用例。

testpaths = tests

# 让 `import module.*` / `import tasks.*` 在任意工作目录下都能解析
pythonpath = .

# 不写 .pytest_cache，避免污染仓库
cache_dir = .pytest_cache

# 让函数式测试里的 fixture 参数名更直观，便于排查
addopts = -ra

filterwarnings =
    # pydantic v1 风格的 @validator 仍有多处，属已知存量问题，不在基线里刷屏
    ignore::DeprecationWarning
    ignore::UserWarning
